<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ScalLoc sequential UAV localization</title>
  <desc id="desc">A coral drone above a blue folded map, with a location pin and connected trajectory waypoints.</desc>

  <!-- A folded satellite map, with a continuous sequence of localized poses. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 165L83 144L141 164L208 141L234 217L174 239L113 219L23 238Z" fill="#F0F9FF" stroke="#176FB2" stroke-width="5"/>
    <path d="M83 147L113 217L174 237L141 166Z" fill="#D9F0FF"/>
    <path d="M83 146L113 219M141 165L174 237" stroke="#176FB2" stroke-width="4"/>
    <path d="M48 211C64 212 74 189 95 188S128 213 150 208S176 177 199 177" stroke="#168ED0" stroke-width="4.5" stroke-dasharray="5 8"/>
    <circle cx="48" cy="211" r="6" fill="#FFFFFF" stroke="#176FB2" stroke-width="3.5"/>
    <circle cx="95" cy="188" r="6" fill="#FFFFFF" stroke="#176FB2" stroke-width="3.5"/>
    <circle cx="150" cy="208" r="6" fill="#FFFFFF" stroke="#176FB2" stroke-width="3.5"/>
    <circle cx="199" cy="177" r="7" fill="#FB9DAA" stroke="#176FB2" stroke-width="3.5"/>

    <!-- The location pin is deliberately readable at the 150 px header size. -->
    <path d="M75 65C53 65 36 82 36 103C36 130 75 174 75 174S114 130 114 103C114 82 97 65 75 65Z" fill="#FFFFFF" stroke="#176FB2" stroke-width="5.5"/>
    <circle cx="75" cy="103" r="20" fill="#E3F4FF" stroke="#176FB2" stroke-width="5"/>

    <!-- Four rotors, a central airframe, and a downward-facing camera. -->
    <g stroke="#FB9DAA" stroke-width="5">
      <path d="M181 57L151 35M181 57L213 35M181 57L151 80M181 57L213 80"/>
      <ellipse cx="151" cy="32" rx="16" ry="6"/>
      <ellipse cx="213" cy="32" rx="16" ry="6"/>
      <ellipse cx="151" cy="83" rx="16" ry="6"/>
      <ellipse cx="213" cy="83" rx="16" ry="6"/>
      <path d="M151 25V20M213 25V20M151 90V95M213 90V95"/>
      <rect x="166" y="43" width="31" height="29" rx="10" fill="#FB9DAA"/>
      <path d="M174 74V86M190 74V86"/>
      <rect x="174" y="85" width="16" height="12" rx="3" fill="#FB9DAA" stroke-width="3"/>
    </g>
    <circle cx="182" cy="91" r="3.5" fill="#164E72"/>
    <path d="M174 111L159 143M192 111L208 142" stroke="#71BCEC" stroke-width="3" stroke-dasharray="4 6"/>
  </g>
</svg>
